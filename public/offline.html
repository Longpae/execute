<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>Execute</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #0d0d0d;
        color: #f3f3f3;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 430px);
        border: 1px solid #252525;
        border-radius: 24px;
        background: #181818;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #8b8b8b;
        line-height: 1.7;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>오프라인 상태입니다.</h1>
      <p>이미 열어 둔 Execute 데이터는 이 기기에 남아 있습니다. 연결이 돌아오면 다시 실행 흐름을 이어갈 수 있습니다.</p>
    </main>
  </body>
</html>
